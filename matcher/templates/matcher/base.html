<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ResuMatch{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <a href="{% url 'home' %}" class="flex items-center gap-2 font-bold text-xl text-indigo-600">
          <span>ResuMatch</span>
        </a>

        <button id="nav-toggle" class="sm:hidden p-2 rounded-md text-slate-500 hover:bg-slate-100" aria-label="Toggle navigation">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <div class="hidden sm:flex items-center gap-6">
          <a href="{% url 'my_resume' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600">My Resume</a>
          <a href="{% url 'job_check' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600">Check Fit</a>
          <a href="{% url 'dashboard' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600">Dashboard</a>
        </div>
      </div>

      <div id="nav-menu" class="hidden sm:hidden pb-4 flex flex-col gap-2">
        <a href="{% url 'my_resume' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600">My Resume</a>
        <a href="{% url 'job_check' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600">Check Fit</a>
        <a href="{% url 'dashboard' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8">
    {% if messages %}
      <div class="mb-6 space-y-2">
        {% for message in messages %}
          <div class="rounded-lg px-4 py-3 text-sm font-medium bg-green-50 text-green-700 border border-green-200">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 py-6 text-center text-sm text-slate-400">
    ResuMatch — a resume/job-description fit checker built with scikit-learn and PyTorch.
  </footer>

  <script>
    document.getElementById('nav-toggle').addEventListener('click', function () {
      document.getElementById('nav-menu').classList.toggle('hidden');
    });
  </script>
</body>
</html>
